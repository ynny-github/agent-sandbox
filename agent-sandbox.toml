  # Tool execution mode: "hook" routes the agent's Bash/Monitor commands into
  # `agent-sandbox exec` through a PreToolUse hook that `agent-sandbox claude`
  # injects at launch via --settings (nothing is stored in .claude/settings.json).
  tool_mode = "hook"

  # Host access is declared per sandbox. [sandbox.shared] applies to both the
  # launched agent and the shell sandbox brokered commands run in;
  # [sandbox.agent] and [sandbox.shell] apply to exactly one of them. Nothing is
  # inherited between the two, so a grant reaches a sandbox only if it is
  # written where that sandbox can see it.
  #
  # Capabilities are named bundles (go/python -> runtime groups; docker/ssh ->
  # credential reads + the matching agent read-block; mise -> tool state). A
  # bundle can also carry the network domains its toolchain needs, which is why
  # nothing here has to name the Go module proxy: "go" brings it. Raw grants
  # (allow/read/allow_file/read_file/allow_env) cover anything not bundled.
  [sandbox.shared]
  capabilities = ["go", "python", "mise", "bashrc"]

  [sandbox.agent]
  # docker and ssh expose host credentials. Declaring them here — and not in
  # the shared base — is what keeps them away from brokered commands: commands
  # need toolchains, not keys.
  capabilities = ["docker", "ssh"]

  # Command routing. allow_commands runs on the host; everything unmatched goes
  # to the shell sandbox.
  #
  # "mise use *" covers "mise use -g" too: allow is evaluated before drop and
  # the patterns have no negation, so a "mise use" allow cannot carve out the
  # global form. The mise capability grants ~/.config/mise read-only, so a
  # global write is refused by the profile rather than by this list.
  allow_commands = [
    "go *",
    "mise use *",
    "mise install *"
  ]

  # Bare git is refused everywhere (host and sandbox) so that all git goes
  # through the built-in `agent-sandbox safe git` wrapper, which rejects
  # known-dangerous invocations (force push, hard reset, clean -f, --no-verify,
  # config writes, ...). The wrapper itself is always host-allowed.
  #
  # gh is refused here (formerly a built-in rule) so the agent uses the GitHub
  # MCP server's tools instead of the gh CLI. Each entry is a
  # { pattern, message } table; message is optional and, when omitted, the
  # default "dropped: command matches drop pattern ..." line is printed.
  drop_commands = [
    { pattern = "git *" },
    { pattern = "gh", message = "gh is disabled in this sandbox. Use the GitHub MCP server's tools instead." },
    { pattern = "gh *", message = "gh is disabled in this sandbox. Use the GitHub MCP server's tools instead." },
  ]

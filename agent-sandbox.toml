  # Tool execution mode: "hook" routes the agent's Bash/Monitor commands into
  # `agent-sandbox exec` through a PreToolUse hook that `agent-sandbox claude`
  # injects at launch via --settings (nothing is stored in .claude/settings.json).
  tool_mode = "hook"

  # [sandbox.agent] is the only profile agent-sandbox generates: the host
  # access of the launched agent process itself (its own file tools, and any
  # MCP server it spawns as a direct child — those are not brokered, so a
  # Python- or Go-based MCP server needs its runtime granted here same as the
  # agent does). The sandbox a shell command runs in is the command profile at
  # command-profile.json (the default name, so command_profile is unset here);
  # agent-sandbox does not generate or read it.
  #
  # Capabilities are named bundles (go/python -> runtime groups; docker/ssh ->
  # credential reads + the matching deny-block on Claude's own file tools;
  # mise -> tool state; bashrc -> shell rc files). Raw grants
  # (allow/read/allow_file/read_file/allow_env) cover anything not bundled.
  [sandbox.agent]
  capabilities = ["go", "python", "mise", "bashrc", "docker", "ssh"]

  # NixOS host. Every executable lives under /nix/store and is reached through
  # the /run/current-system/sw symlink farm; there is no /bin/ls or /usr/bin/ls
  # to fall back on. nono's base profile lets this sandbox *read* that tree but
  # not execute from it, so without these entries nothing built on it can
  # start: nono resolves the binary, execve is refused, and the command exits
  # 127 with no output at all. A `read` grant carries the execute right — the
  # mise-installed Go toolchain already runs from one.
  read = ["/nix/store", "/run/current-system/sw"]

  # nono's system_write_linux group covers /tmp write-only, but a toolchain
  # that builds there reads back what it wrote: Go's $WORK tree fails with
  # "open /tmp: permission denied" on write-only.
  allow = ["/tmp"]

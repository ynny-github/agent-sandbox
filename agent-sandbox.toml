  # Tool execution mode: "hook" routes the agent's Bash/Monitor commands through
  # the PreToolUse hook (see .claude/settings.json) into `agent-sandbox exec`.
  tool_mode = "hook"

  [sandbox.network]
  # Extra domains on top of nono's fixed "developer" network profile, which
  # every brokered command runs under. The preset does not include the Go
  # module proxy, so this project must add it.
  allow_domains = ["proxy.golang.org", "sum.golang.org"]

  [sandbox.command]
  allow = [
    "taskgate ai *",
    "go *"
  ]

  # Bare git is refused everywhere (host and sandbox) so that all git goes
  # through the built-in `agent-sandbox safe git` wrapper, which rejects
  # known-dangerous invocations (force push, hard reset, clean -f, --no-verify,
  # config writes, ...). The wrapper itself is always host-allowed.
  #
  # gh is refused here (formerly a built-in rule) so the agent uses the GitHub
  # MCP server's tools instead of the gh CLI. Each drop entry is a
  # { pattern, message } table; message is optional and, when omitted, the
  # default "dropped: command matches drop pattern ..." line is printed.
  drop = [
    { pattern = "git *" },
    { pattern = "gh", message = "gh is disabled in this sandbox. Use the GitHub MCP server's tools instead." },
    { pattern = "gh *", message = "gh is disabled in this sandbox. Use the GitHub MCP server's tools instead." },
  ]

  # Host-side access for the sandboxed agent (translated into the nono profile
  # generated at launch; nono.jsonc is no longer used). Capabilities are named
  # bundles (go/python -> runtime groups; docker/ssh -> credential reads + the
  # matching agent read-block; mise/taskgate -> tool state).
  # Raw grants (allow/read/allow_file/read_file/allow_env) cover anything not bundled.
  [sandbox.host]
  capabilities = ["go", "python", "docker", "ssh", "mise", "taskgate", "bashrc"]

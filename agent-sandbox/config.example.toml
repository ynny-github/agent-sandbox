# Tool execution mode: "mcp" (agent uses the run_command MCP tool; Bash/Monitor
# disabled) or "hook" (agent uses Bash/Monitor, routed via a PreToolUse hook that
# `agent-sandbox claude` injects at launch). Default: "mcp".
tool_mode = "mcp"

[mcp]
command_output_dir = "/tmp/mcp-output"

[sandbox.network]
# Commands routed to the sandbox run under nono's "developer" network profile
# (LLM APIs, package registries, GitHub, sigstore, documentation). List any
# extra domains here. The preset does NOT include proxy.golang.org.
allow_domains = [
  # "proxy.golang.org",
  # "sum.golang.org",
]

[sandbox.command]
allow = [
  "git *",
  "make *",
]
drop = [
  # { pattern = "rm -rf *" },
]
# Environment variables forwarded to sandboxed commands. NONO_* is rejected:
# those variables reconfigure the command sandbox itself.
env_passthrough = [
  # "AWS_PROFILE",
]

[sandbox.host]
# Named capability bundles (go, python, node, rust, docker, ssh, mise, taskgate, bashrc).
capabilities = ["go", "python"]
# Raw host grants for anything not covered by a capability (optional):
# allow      = []   # read+write host directories
# read       = []   # read-only host directories
# allow_file = []   # single file, read+write
# read_file  = []   # single file, read-only
# allow_env  = []   # extra env vars (beyond the always-on PATH/HOME/... baseline)

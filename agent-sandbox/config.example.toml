# Tool execution mode: "mcp" (agent uses the run_command MCP tool; Bash/Monitor
# disabled) or "hook" (agent uses Bash/Monitor, routed via a PreToolUse hook that
# `agent-sandbox claude` injects at launch). Default: "mcp".
tool_mode = "mcp"

[mcp]
command_output_dir = "/tmp/mcp-output"

# [sandbox.agent] is the only section agent-sandbox reads for host access, and
# the only nono profile it generates: the launched agent's own process (its
# file tools, and any MCP server it spawns as a direct child — those are not
# brokered). The sandbox a shell *command* runs in is a completely separate
# concern, decided entirely by the command profile below; nothing declared
# here reaches a brokered command.
#
#   capabilities = []   # named bundles: go, python, node, rust, dart, flutter,
#                       #                docker, ssh, mise, bashrc
#   allow        = []   # read+write host directories
#   read         = []   # read-only host directories
#   allow_file   = []   # single file, read+write
#   read_file    = []   # single file, read-only
#   allow_env    = []   # env vars (beyond the always-on PATH/HOME/... baseline)
[sandbox.agent]
# docker and ssh expose host credentials; declared here they reach the agent's
# own process and never a brokered command.
capabilities = ["go", "python"]

# Which commands the agent may run, what each may touch, and which
# invocations are refused is not declared here at all: it lives in
# command-profile.json (the default name, resolved beside this file), written
# directly in nono's own schema. A missing file is a launch error — there is
# no generated default. See README.md's "The command profile" section.

# Tool execution mode: "mcp" (agent uses the run_command MCP tool; Bash/Monitor
# disabled) or "hook" (agent uses Bash/Monitor, routed via a PreToolUse hook that
# `agent-sandbox claude` injects at launch). Default: "mcp".
tool_mode = "mcp"

[mcp]
command_output_dir = "/tmp/mcp-output"

[sandbox.network]
allow_external = false               # true = unrestricted internet (prompts y/N at startup); false (default) = no external access

[sandbox.command]
allow = [
  "git *",
  "make *",
  "npm run *",
]
drop = [
  # "rm -rf *",
  # "sudo *",
]

[sandbox.container]
build_context = "./docker/sandbox"   # required: path to Docker build context
dockerfile = "Dockerfile"            # required: Dockerfile name within build_context
image = "myapp"                      # required: image name (actual tag: agent-sandbox/<image>)
# external_network = "default"       # opt-in: join the project's "<project>_<suffix>" compose
                                     # network (e.g. "default" -> "<project>_default"). Unset =
                                     # join no project network.
env_passthrough = [
  # "AWS_PROFILE",
  # "HOME",
]

[sandbox.host]
# Named capability bundles (go, python, node, rust, docker, ssh, mise, taskgate).
capabilities = ["go", "python"]
# Raw host grants for anything not covered by a capability (optional):
# allow      = []   # read+write host directories
# read       = []   # read-only host directories
# allow_file = []   # single file, read+write
# read_file  = []   # single file, read-only
# allow_env  = []   # extra env vars (beyond the always-on PATH/HOME/... baseline)

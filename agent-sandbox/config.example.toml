# Tool execution mode: "mcp" (agent uses the run_command MCP tool; Bash/Monitor
# disabled) or "hook" (agent uses Bash/Monitor, routed via a PreToolUse hook that
# `agent-sandbox claude` injects at launch). Default: "mcp".
tool_mode = "mcp"

[mcp]
command_output_dir = "/tmp/mcp-output"

# Host access is declared per sandbox, and nothing is inherited between them:
#
#   [sandbox.shared]  -> both the launched agent and the shell sandbox
#   [sandbox.agent]   -> the launched agent only
#   [sandbox.shell]   -> the sandbox brokered commands run in, only
#
# A grant reaches a sandbox only if it is written where that sandbox can see it,
# so "keep this away from sandboxed commands" is expressed by declaring it under
# [sandbox.agent] — there is nothing to subtract afterwards.
#
# Each section takes the same host-access fields:
#   capabilities = []   # named bundles: go, python, node, rust, dart, flutter,
#                       #                docker, ssh, mise, bashrc
#                       # A bundle also carries the network domains its
#                       # toolchain needs (go the module proxy, python PyPI,
#                       # node the npm registry, ...) for the shell sandbox, so
#                       # they never have to be restated in allow_domains below.
#   allow        = []   # read+write host directories
#   read         = []   # read-only host directories
#   allow_file   = []   # single file, read+write
#   read_file    = []   # single file, read-only
#   allow_env    = []   # env vars (beyond the always-on PATH/HOME/... baseline)
[sandbox.shared]
capabilities = ["go", "python"]

[sandbox.agent]
# docker and ssh expose host credentials; declared here they never reach a
# brokered command.
capabilities = []

# Command routing: allow_commands runs on the host, drop_commands is refused
# outright, and everything else goes to the shell sandbox. Each drop_commands
# entry is a { pattern, message } table; message is optional and, when omitted,
# a default "dropped: command matches drop pattern ..." line is printed.
allow_commands = [
  "git *",
  "make *",
  "npm run *",
]
drop_commands = [
  # { pattern = "rm -rf *" },
  # { pattern = "gh *", message = "gh is disabled; use the GitHub MCP tools." },
]

[sandbox.shell]
# Environment variables forwarded to sandboxed commands. NONO_* is rejected in
# every section: those variables reconfigure the shell sandbox itself.
allow_env = [
  # "AWS_PROFILE",
  # "CI",
]
# Sandboxed commands run under nono's "developer" network profile (LLM APIs,
# package registries, GitHub, sigstore, documentation), plus whatever the
# capabilities declared for this side bring with them. List here only what
# neither covers.
allow_domains = [
  # "internal.example.com",
]
